services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repoguardian-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repoguardian}
      POSTGRES_USER: ${POSTGRES_USER:-repoguardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repoguardian_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - repoguardian-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repoguardian} -d ${POSTGRES_DB:-repoguardian}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  repoguardian-postgres-data:
